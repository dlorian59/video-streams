name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dlorian59/file-streams
          ref: d03a2c97b10c38977b8e121897ac4e8007a8ed8d
          path: dependency-file-streams
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install external media tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Build exact file-streams dependency
        run: |
          dependency-file-streams/gradlew -p dependency-file-streams publishToMavenLocal -Dmaven.repo.local="$GITHUB_WORKSPACE/../file-streams/build/local-repository" --no-daemon --max-workers=2
      - name: Verify real FFmpeg preparation, resource bounds and Java examples
        run: ./gradlew build publishAllPublicationsToLocalRepository --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-${{ matrix.java }}-reports
          path: '**/build/reports/tests/**'
